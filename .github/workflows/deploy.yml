name: Deploy

# O GitHub Actions voltou a rodar neste repositório. O `git push production main`
# (infra/README.md §8) continua como alternativa; os dois usam o mesmo lock no
# servidor, então não rodam ao mesmo tempo.
#
# Runs tests on every PR; deploys only on push to main (+ manual trigger).
# Builds happen ON the DigitalOcean droplet (no external registry). Requires
# repo secrets: CI_GATE_SSH_KEY (chave presa ao ci-gate) e CI_GATE_KNOWN_HOSTS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Backend tests
        working-directory: backend
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx vitest run

  deploy:
    needs: test
    # Never deploy from a pull request — only push to main / manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy pelo ci-gate
        # A chave só aciona `deploy sspx-catechism` no ci-gate do servidor (sem shell);
        # o passo a passo do deploy está em sspx-school/infra/ci-gate.
        env:
          SSH_KEY: ${{ secrets.CI_GATE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CI_GATE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            renan@64.225.15.219 "deploy sspx-catechism"
